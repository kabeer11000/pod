<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pod Board</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #6b7385;
        --accent: #3b5bdb;
        --line: #e2e5ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161b;
          --card: #1d2027;
          --text: #e8eaf0;
          --muted: #9097a8;
          --accent: #748ffc;
          --line: #2c3039;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      h1 { margin: 0; font-size: 22px; }
      #status { font-size: 13px; color: var(--muted); }
      #status.live::before { content: "● "; color: #2f9e44; }
      #status.down::before { content: "● "; color: #e03131; }
      form { display: flex; gap: 8px; margin: 20px 0 12px; }
      input[type="text"] {
        flex: 1; padding: 10px 12px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
      }
      button {
        padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--card); color: var(--text); font: inherit; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
      li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
      li:last-child { border-bottom: 0; }
      li.done .title { text-decoration: line-through; color: var(--muted); }
      .title { flex: 1; overflow-wrap: anywhere; }
      .meta { font-size: 12px; color: var(--muted); }
      .empty { padding: 20px; text-align: center; color: var(--muted); }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
      .x { border: 0; background: none; color: var(--muted); padding: 4px 8px; }
      footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Pod Board · <span id="board"></span></h1>
        <span id="status">connecting…</span>
      </header>
      <form id="add">
        <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" required maxlength="200" />
        <button class="primary" type="submit">Add</button>
      </form>
      <ul id="tasks"><li class="empty">Loading…</li></ul>
      <div class="toolbar">
        <span id="count" class="meta"></span>
        <span>
          <button id="complete-all" type="button">Complete all</button>
          <button id="clear" type="button">Clear completed</button>
        </span>
      </div>
      <footer>
        Open this page in two windows to see live updates. Each board is its own Pod namespace,
        e.g. <code>?board=team-a</code>. Server: <code id="server"></code>
      </footer>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
